experiments:
  - name: "inverse_distance_convergence"
    base_params:
      stopper: "threshold"
      scheduler: "convergence"
      pair_weighting: "inverse_distance"
      batch_size: 25000
      pair_weighting_floor_quantile: 0.005
      pair_weighting_max_step: 0.05
      stopper_params:
        threshold: 0.004
        patience: 6
      n_components: 2
      random_state: 7
    search:
      batch_size: [20000]
      pair_weighting_floor_quantile: [0.0001]
      pair_weighting_max_step: [0.01, 0.05, 0.1]
      stopper_params.threshold: [0.003]
      stopper_params.patience: [8]
      max_iter: [10000]